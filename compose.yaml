services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: craftbook
      POSTGRES_USER: craftbook
      POSTGRES_PASSWORD: craftbook
    ports:
      - "5432:5432"
    volumes:
      - craftbook-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftbook -d craftbook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  craftbook-postgres:
